name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'ProjectSettings/**', 'Packages/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.50f1
          projectPath: .
          buildName: Tempest
          buildsPath: build
          androidExportType: androidAPK
          androidAppBundle: false
          androidSdkVersion: auto

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tempest-Android-APK
          path: build/Android
          retention-days: 14